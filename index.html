            return (
              '<article class="stop-card' + (isVisited ? " is-visited" : "") + (isHighlighted ? " is-highlighted" : "") + '" id="card-' + spot.id + '" data-pin-id="' + spot.id +
              '" style="--day-accent:' + theme.color + ";--day-soft:" + theme.softBg + '">' +
              '<div class="stop-media" data-focus-pin="' + spot.id + '">' +
              buildImgTag(spot.images, {
                photoIdx: pIdx,
                title: spot.name,
                category: spot.category,
                neighborhood: spot.neighborhood,
                grad: spot.gradientTheme
              }) +
              '<div class="media-top-badges">' +
              '<span class="stop-number-pill">' + escapeHtml(spot.code) + "</span>" +
              '<span class="category-glass-pill">' + escapeHtml(spot.category) + "</span></div>" +
              (totalPhotos > 1
                ? '<button type="button" class="photo-next-btn" data-cycle-photo="' + spot.id + '">Foto ' +
                  ((pIdx % totalPhotos) + 1) + "/" + totalPhotos + " ▸</button>"
                : "") +
              "</div>" +
              '<div class="stop-body">' +
              '<div class="stop-meta-row"><div class="stop-meta-left">' +
              '<span class="time-badge">' + escapeHtml(spot.bestFor) + "</span>" +
              '<span class="neighborhood-pill">' + escapeHtml(spot.neighborhood) + "</span></div>" +
              '<button type="button" class="btn-focus-map" data-focus-pin="' + spot.id + '">Mapa</button></div>' +
              '<h3 class="stop-title">' + escapeHtml(spot.name) + "</h3>" +
              '<p class="stop-address">' + escapeHtml(spot.address) + "</p>" +
              '<p class="stop-highlights">' + escapeHtml(spot.highlights) + "</p>" +
              '<div class="callout-why"><strong>Funcionamento:</strong> ' + escapeHtml(spot.hoursNote) + "</div>" +
              '<div class="action-bar">' +
              '<a class="action-btn action-btn-maps" href="' + escapeHtml(spot.mapsUrl) + '" target="_blank" rel="noopener noreferrer">Google Maps</a>' +
              (spot.videoUrl
                ? '<a class="action-btn" href="' + escapeHtml(spot.videoUrl) + '" target="_blank" rel="noopener noreferrer">Reel</a>'
                : "") +
              (spot.instaUrl
                ? '<a class="action-btn" href="' + escapeHtml(spot.instaUrl) + '" target="_blank" rel="noopener noreferrer">' +
                  escapeHtml(spot.instaLabel || "Instagram") + "</a>"
                : "") +
              '<button type="button" class="action-btn action-btn-visited' + (isVisited ? " is-checked" : "") +
              '" data-toggle-visited="' + spot.id + '" aria-pressed="' + (isVisited ? "true" : "false") + '">' +
              '<span class="check-box-ui" aria-hidden="true">✓</span>' +
              "<span>" + (isVisited ? "Visitado" : "Marcar visitado") + "</span></button>" +
              "</div></div></article>"
            );
          })
          .join("");

        return (
          '<section class="day-hero" style="--day-accent:' + theme.color + '">' +
          '<h2 class="day-hero-title">' + escapeHtml(theme.themeTitle) + "</h2>" +
          '<p class="day-hero-desc">' + escapeHtml(theme.themeSubtitle) + "</p></section>" +
          '<div class="planb-grid">' + cardsHtml + "</div>"
        );
      }

      function renderMainContent() {
        const pane = document.getElementById("timeline-content");
        if (!pane) return;
        if (state.activeTab === "overview") pane.innerHTML = renderOverview();
        else if (state.activeTab === "planb") pane.innerHTML = renderPlanB();
        else pane.innerHTML = renderDayTimeline(state.activeTab);
      }

      /* Map Synchronization & Hybrid Docked + Popup Behavior */
      function initMap() {
        const mapEl = document.getElementById("poa-map");
        if (!mapEl || typeof window.L === "undefined") return;

        map = window.L.map(mapEl, {
          zoomControl: false,
          scrollWheelZoom: true,
          tapTolerance: 18
        }).setView([-30.0265, -51.2015], 13);

        window.L.control.zoom({ position: "bottomright" }).addTo(map);
        const esriClean = window.L.tileLayer(
          "https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}",
          {
            attribution: "Tiles &copy; Esri &middot; Dados OSM",
            maxNativeZoom: 19,
            maxZoom: 20
          }
        );
        const osmDetailed = window.L.tileLayer(
          "https://{s}.tile.openstreetmap.fr/hot/{z}/{x}/{y}.png",
          {
            attribution: "&copy; <a href=\"https://www.openstreetmap.org/copyright\">OpenStreetMap</a> &middot; HOT",
            subdomains: "abc",
            maxNativeZoom: 19,
            maxZoom: 20
          }
        );
        const esriSat = window.L.tileLayer(
          "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
          {
            attribution: "Tiles &copy; Esri",
            maxNativeZoom: 19,
            maxZoom: 20
          }
        );

        esriClean.addTo(map);
        window.L.control.layers(
          {
            "Mapa limpo": esriClean,
            "Ruas detalhadas (OSM)": osmDetailed,
            "Satélite": esriSat
          },
          null,
          { position: "topright", collapsed: true }
        ).addTo(map);

        routesLayer = window.L.layerGroup().addTo(map);
        markersLayer = window.L.layerGroup().addTo(map);
      }

      function createPinIcon(label, bgColor, extraClass) {
        const isHotel = extraClass && extraClass.includes("is-hotel");
        return window.L.divIcon({
          className: "poa-pin-wrapper",
          html: '<div class="poa-pin ' + (extraClass || "") + '" style="--pin-bg:' + bgColor + '"><span>' + escapeHtml(label) + "</span></div>",
          iconSize: isHotel ? [35, 35] : [32, 32],
          iconAnchor: isHotel ? [17, 33] : [16, 30],
          popupAnchor: [0, -28]
        });
      }

      function getPopupOptions() {
        return {
          maxWidth: 230,
          minWidth: 180,
          autoPanPaddingTopLeft: [12, 12],
          autoPanPaddingBottomRight: [12, 16]
        };
      }

      function buildPopupHtml(opts) {
        const isChecked = state.visited.has(opts.id);
        const checkBtn = opts.canCheck
          ? '<button type="button" class="popup-btn-visited' + (isChecked ? " is-checked" : "") +
            '" data-toggle-visited="' + escapeHtml(opts.id) + '">' +
            '<span class="check-box-ui" aria-hidden="true">✓</span>' +
            "<span>" + (isChecked ? "Visitado" : "Marcar visitado") + "</span></button>"
          : "";
        return (
          '<div class="map-popup-card">' +
          '<div class="map-popup-kicker" style="color:' + escapeHtml(opts.color || "#1E293B") + '">' + escapeHtml(opts.kicker) + "</div>" +
          '<h4 class="map-popup-title">' + escapeHtml(opts.title) + "</h4>" +
          '<p class="map-popup-addr">' + escapeHtml(opts.address) + "</p>" +
          '<div class="map-popup-actions">' +
          checkBtn +
          '<button type="button" class="popup-btn-card" data-popup-card="' + escapeHtml(opts.id) + '" data-popup-tab="' + escapeHtml(opts.dayTab || "") + '">No roteiro</button>' +
          '<a class="popup-btn-gmaps" href="' + escapeHtml(opts.mapsUrl) + '" target="_blank" rel="noopener noreferrer">Maps</a>' +
          "</div></div>"
        );
      }

      function getDefaultLegendLabel() {
        if (state.activeTab === "overview") return POA_TRIP_DATA.meta.totalConfirmedStops + " paradas + hotel";
        if (state.activeTab === "planb") return "Planos B (" + POA_TRIP_DATA.planB.length + " locais)";
        const theme = POA_TRIP_DATA.dayThemes[state.activeTab];
        return theme ? "Rota · " + theme.shortLabel : "Rota do dia";
      }

      function setLegendText(text) {
        const legendEl = document.getElementById("map-legend-text");
        if (legendEl) legendEl.textContent = text;
      }

      function syncMapLayers(shouldFit) {
        if (!map || !markersLayer || !routesLayer) return;
        markersLayer.clearLayers();
        routesLayer.clearLayers();
        markerRegistry.clear();
        pinTitleRegistry.clear();

        const boundsCoords = [];
        const hotel = POA_TRIP_DATA.baseHotel;

        const hotelMarker = window.L.marker([hotel.lat, hotel.lng], {
          icon: createPinIcon("H", "#0F172A", "is-hotel"),
          zIndexOffset: 900
        })
          .bindPopup(
            buildPopupHtml({
              id: hotel.id,
              dayTab: "overview",
              kicker: "Hotel base",
              title: hotel.name,
              address: hotel.address,
              mapsUrl: hotel.mapsUrl,
              color: "#0F172A"
            }),
            getPopupOptions()
          )
          .addTo(markersLayer);

        hotelMarker.on("click", () => {
          state.focusedPinId = hotel.id;
          setLegendText(hotel.name);
          highlightTimelineCard(hotel.id, false);
        });

        markerRegistry.set(hotel.id, hotelMarker);
        pinTitleRegistry.set(hotel.id, hotel.name);
        boundsCoords.push([hotel.lat, hotel.lng]);

        if (state.activeTab === "overview") {
          setLegendText(POA_TRIP_DATA.meta.totalConfirmedStops + " paradas + hotel");
          ["sat", "sun", "mon"].forEach((dayKey) => {
            const theme = POA_TRIP_DATA.dayThemes[dayKey];
            const pts = [[hotel.lat, hotel.lng]];
            getDayItems(dayKey).forEach((item) => {
              if (item.type !== "stop") return;
              const cls = state.visited.has(item.id) ? "is-visited" : "";
              const labelTitle = "#" + item.stopNumber + " " + item.name;
              const m = window.L.marker([item.lat, item.lng], {
                icon: createPinIcon(String(item.stopNumber), theme.color, cls),
                zIndexOffset: 500 - item.stopNumber
              })
                .bindPopup(
                  buildPopupHtml({
                    id: item.id,
                    dayTab: dayKey,
                    kicker: theme.shortLabel + " · " + item.time,
                    title: labelTitle,
                    address: item.address,
                    mapsUrl: item.mapsUrl,
                    color: theme.color,
                    canCheck: true
                  }),
                  getPopupOptions()
                )
                .addTo(markersLayer);
              m.on("click", () => {
                state.focusedPinId = item.id;
                setLegendText(labelTitle);
                highlightTimelineCard(item.id, false);
              });
              markerRegistry.set(item.id, m);
              pinTitleRegistry.set(item.id, labelTitle);
              pts.push([item.lat, item.lng]);
              boundsCoords.push([item.lat, item.lng]);
            });
            window.L.polyline(pts, { color: theme.color, weight: 2.5, opacity: 0.55, dashArray: "6, 8" }).addTo(routesLayer);
          });
        } else if (state.activeTab === "planb") {
          const theme = POA_TRIP_DATA.dayThemes.planb;
          setLegendText("Planos B (" + POA_TRIP_DATA.planB.length + " locais)");
          POA_TRIP_DATA.planB.forEach((spot) => {
            const cls = state.visited.has(spot.id) ? "is-visited" : "";
            const labelTitle = spot.code + " · " + spot.name;
            const m = window.L.marker([spot.lat, spot.lng], {
              icon: createPinIcon(spot.code, theme.color, cls),
              zIndexOffset: 450
            })
              .bindPopup(
                buildPopupHtml({
                  id: spot.id,
                  dayTab: "planb",
                  kicker: spot.code + " · " + spot.bestFor,
                  title: spot.name,
                  address: spot.address,
                  mapsUrl: spot.mapsUrl,
                  color: theme.color,
                  canCheck: spot.type !== "logistics"
                }),
                getPopupOptions()
              )
              .addTo(markersLayer);
            m.on("click", () => {
              state.focusedPinId = spot.id;
              setLegendText(labelTitle);
              highlightTimelineCard(spot.id, true);
            });
            markerRegistry.set(spot.id, m);
            pinTitleRegistry.set(spot.id, labelTitle);
            boundsCoords.push([spot.lat, spot.lng]);
          });
        } else {
          const dayKey = state.activeTab;
          const theme = POA_TRIP_DATA.dayThemes[dayKey];
          setLegendText("Rota · " + theme.shortLabel);
          const pts = [];

          getDayItems(dayKey).forEach((item) => {
            if (item.choiceKey && item.choiceKey !== state.mondayMorningChoice) return;
            if (item.type === "stop") {
              const cls = state.visited.has(item.id) ? "is-visited" : "";
              const labelTitle = "#" + item.stopNumber + " " + item.name;
              const m = window.L.marker([item.lat, item.lng], {
                icon: createPinIcon(String(item.stopNumber), theme.color, cls),
                zIndexOffset: 600 - item.stopNumber
              })
                .bindPopup(
                  buildPopupHtml({
                    id: item.id,
                    dayTab: dayKey,
                    kicker: "#" + item.stopNumber + " · " + item.time,
                    title: item.name,
                    address: item.address,
                    mapsUrl: item.mapsUrl,
                    color: theme.color,
                    canCheck: true
                  }),
                  getPopupOptions()
                )
                .addTo(markersLayer);
              m.on("click", () => {
                state.focusedPinId = item.id;
                setLegendText(labelTitle);
                highlightTimelineCard(item.id, true);
              });
              markerRegistry.set(item.id, m);
              pinTitleRegistry.set(item.id, labelTitle);
              pts.push([item.lat, item.lng]);
              boundsCoords.push([item.lat, item.lng]);
            } else if (item.type === "logistics" && item.lat && item.lng) {
              pts.push([item.lat, item.lng]);
              boundsCoords.push([item.lat, item.lng]);
              const nearHotel = Math.abs(item.lat - hotel.lat) < 0.0005 && Math.abs(item.lng - hotel.lng) < 0.0005;
              if (!nearHotel) {
                const sm = window.L.marker([item.lat, item.lng], {
                  icon: createPinIcon("•", "#475569", ""),
                  zIndexOffset: 300
                })
                  .bindPopup(
                    buildPopupHtml({
                      id: item.id,
                      dayTab: dayKey,
                      kicker: item.time,
                      title: item.title,
                      address: item.address,
                      mapsUrl: item.mapsUrl,
                      color: theme.color
                    }),
                    getPopupOptions()
                  )
                  .addTo(markersLayer);
                sm.on("click", () => {
                  state.focusedPinId = item.id;
                  setLegendText(item.title);
                  highlightTimelineCard(item.id, true);
                });
                markerRegistry.set(item.id, sm);
                pinTitleRegistry.set(item.id, item.title);
              } else {
                markerRegistry.set(item.id, hotelMarker);
                pinTitleRegistry.set(item.id, item.title);
              }
            }
          });

          if (pts.length > 1) {
            window.L.polyline(pts, { color: theme.color, weight: 3, opacity: 0.8, dashArray: "7, 8" }).addTo(routesLayer);
          }
        }

        if (boundsCoords.length) {
          currentBounds = window.L.latLngBounds(boundsCoords);
          if (shouldFit) fitCurrentRoute();
        }
      }

      function fitCurrentRoute() {
        if (!map || !currentBounds) return;
        map.closePopup();
        setLegendText(getDefaultLegendLabel());
        const isSmallScreen = window.innerWidth <= 640;
        const pad = isSmallScreen ? [26, 26] : [40, 40];
        map.fitBounds(currentBounds, { padding: pad, maxZoom: 15 });
      }

      function setMapExpanded(expanded) {
        state.mapExpanded = Boolean(expanded);
        document.body.classList.toggle("map-expanded", state.mapExpanded);
        const expandBtn = document.getElementById("btn-map-expand");
        if (expandBtn) {
          expandBtn.setAttribute("aria-pressed", state.mapExpanded ? "true" : "false");
          expandBtn.textContent = state.mapExpanded ? "Reduzir" : "Ampliar";
        }
        if (map) {
          setTimeout(() => map.invalidateSize(), 260);
        }
      }

      function setMapOpen(open) {
        const nextOpen = Boolean(open);
        const drawer = document.getElementById("map-drawer");
        state.mapOpen = nextOpen;

        if (nextOpen) {
          if (drawer) {
            drawer.classList.remove("is-closing");
            drawer.style.transform = "";
          }
          document.body.classList.add("map-open");
          if (map) setTimeout(() => map.invalidateSize(), 40);
          return;
        }

        state.focusedPinId = null;
        if (state.mapExpanded) setMapExpanded(false);
        document.querySelectorAll(".is-highlighted").forEach((el) => el.classList.remove("is-highlighted"));
        document.body.classList.remove("map-open");
        if (drawer) {
          drawer.classList.remove("is-closing");
          drawer.style.transform = "";
        }
        if (map) {
          map.closePopup();
          setLegendText(getDefaultLegendLabel());
          setTimeout(() => {
            map.invalidateSize();
            fitCurrentRoute();
          }, 50);
        }
      }

      function panToPinWithOffset(latlng, zoom) {
        if (!map) return;
        const targetZoom = zoom || 16;
        if (typeof map.project === "function" && typeof map.unproject === "function" && typeof map.getSize === "function") {
          const size = map.getSize();
          const sheetH = size && size.y ? size.y : 300;
          const offsetY = Math.max(34, Math.min(68, Math.round(sheetH * 0.2)));
          const pt = map.project(latlng, targetZoom);
          const shiftedPt = [pt.x, pt.y - offsetY];
          const shiftedLatLng = map.unproject(shiftedPt, targetZoom);
          map.flyTo(shiftedLatLng, targetZoom, { duration: 0.4 });
        } else {
          map.flyTo(latlng, targetZoom, { duration: 0.4 });
        }
      }

      function focusPinOnMap(pinId) {
        const choice = pinId === "stop-12" ? "iguatemi" : pinId === "mon-orla" ? "orla" : null;
        if (choice && state.mondayMorningChoice !== choice) {
          state.mondayMorningChoice = choice;
          renderMainContent();
          syncMapLayers(false);
        }
        if (!map) return;
        state.focusedPinId = pinId;
        const wasClosed = !state.mapOpen;
        if (wasClosed) setMapOpen(true);

        const pinLabel = pinTitleRegistry.get(pinId);
        if (pinLabel) setLegendText(pinLabel);

        const cardEl = document.getElementById("card-" + pinId);
        if (cardEl) {
          setTimeout(() => cardEl.scrollIntoView({ behavior: "smooth", block: "start" }), 65);
        }

        const runFocus = () => {
          map.invalidateSize();
          const m = markerRegistry.get(pinId);
          if (m) {
            panToPinWithOffset(m.getLatLng(), 16);
            m.openPopup();
          }
        };

        setTimeout(runFocus, wasClosed ? 90 : 40);
        if (wasClosed) setTimeout(() => map.invalidateSize(), 310);
      }

      function highlightTimelineCard(cardId, shouldScroll) {
        document.querySelectorAll(".is-highlighted").forEach((el) => el.classList.remove("is-highlighted"));
        const el = document.getElementById("card-" + cardId);
        if (!el) return;
        el.classList.add("is-highlighted");
        if (shouldScroll) el.scrollIntoView({ behavior: "smooth", block: "start" });
      }

      window.scrollToStopCard = function (cardId, targetTab) {
        if (cardId === "stop-12") state.mondayMorningChoice = "iguatemi";
        if (cardId === "mon-orla") state.mondayMorningChoice = "orla";
        if (state.mapExpanded && window.innerWidth <= 640) {
          setMapExpanded(false);
        }
        if (targetTab && VALID_TABS.includes(targetTab) && state.activeTab !== targetTab) {
          switchTab(targetTab, false);
        }
        setTimeout(() => {
          const el = document.getElementById("card-" + cardId);
          if (el) {
            state.focusedPinId = cardId;
            highlightTimelineCard(cardId, false);
            el.scrollIntoView({ behavior: "smooth", block: "start" });
          }
        }, 75);
      };

      function switchTab(nextTab, scrollTop) {
        if (!VALID_TABS.includes(nextTab)) return;
        state.activeTab = nextTab;
        history.replaceState(null, "", "#" + nextTab);
        renderDayTabs();
        scrollActiveTabIntoView();
        renderMainContent();
        syncMapLayers(true);
        if (scrollTop !== false) window.scrollTo({ top: 0, behavior: "smooth" });
      }

      function bindDrawerTouchGestures() {
        const header = document.getElementById("map-drawer-header");
        const drawer = document.getElementById("map-drawer");
        if (!header || !drawer) return;

        let startY = 0;
        let currentDeltaY = 0;
        let tracking = false;

        header.addEventListener(
          "touchstart",
          (e) => {
            if (!state.mapOpen || e.touches.length !== 1) return;
            if (e.target.closest("button")) return;
            startY = e.touches[0].clientY;
            currentDeltaY = 0;
            tracking = true;
            drawer.classList.add("is-dragging");
          },
          { passive: true }
        );

        header.addEventListener(
          "touchmove",
          (e) => {
            if (!tracking || e.touches.length !== 1) return;
            currentDeltaY = e.touches[0].clientY - startY;
            if (currentDeltaY > 0) {
              drawer.style.transform = "translateY(" + Math.round(currentDeltaY) + "px)";
            } else {
              drawer.style.transform = "translateY(" + Math.round(currentDeltaY * 0.25) + "px)";
            }
          },
          { passive: true }
        );

        const finishDrag = () => {
          if (!tracking) return;
          tracking = false;
          drawer.classList.remove("is-dragging");
          drawer.style.transform = "";

          if (currentDeltaY > 52) {
            if (state.mapExpanded && currentDeltaY < 130) {
              setMapExpanded(false);
            } else {
              setMapOpen(false);
            }
          } else if (currentDeltaY < -38 && !state.mapExpanded) {
            setMapExpanded(true);
          }
          currentDeltaY = 0;
        };

        header.addEventListener("touchend", finishDrag, { passive: true });
        header.addEventListener("touchcancel", finishDrag, { passive: true });
      }

      function bindEvents() {
        document.addEventListener("click", (e) => {
          const choice = e.target.closest("[data-monday-choice]");
          if (choice) {
            state.mondayMorningChoice = choice.getAttribute("data-monday-choice");
            renderMainContent();
            syncMapLayers(true);
            return;
          }
          const popupCardBtn = e.target.closest("[data-popup-card]");
          if (popupCardBtn) {
            e.stopPropagation();
            window.scrollToStopCard(
              popupCardBtn.getAttribute("data-popup-card"),
              popupCardBtn.getAttribute("data-popup-tab")
            );
            return;
          }
          const tabBtn = e.target.closest("[data-tab]");
          if (tabBtn) {
            switchTab(tabBtn.getAttribute("data-tab"), true);
            return;
          }
          const jumpBtn = e.target.closest("[data-jump-tab]");
          if (jumpBtn) {
            switchTab(jumpBtn.getAttribute("data-jump-tab"), true);
            return;
          }
          const cycleBtn = e.target.closest("[data-cycle-photo]");
          if (cycleBtn) {
            e.stopPropagation();
            const id = cycleBtn.getAttribute("data-cycle-photo");
            state.photoIndex[id] = (state.photoIndex[id] || 0) + 1;
            renderMainContent();
            return;
          }
          const visitedBtn = e.target.closest("[data-toggle-visited]");
          if (visitedBtn) {
            e.stopPropagation();
            const inPopup = Boolean(visitedBtn.closest(".leaflet-popup"));
            const id = visitedBtn.getAttribute("data-toggle-visited");
            const turnedOn = !state.visited.has(id);
            if (turnedOn) {
              state.visited.add(id);
              showToast("Marcado como visitado");
            } else {
              state.visited.delete(id);
              showToast("Parada desmarcada");
            }
            recordLocalVisit(id, turnedOn);
            saveVisited();
            updateProgressUI();
            renderMainContent();
            syncMapLayers(false);
            GroupSync.queuePush();
            if (inPopup) {
              const m = markerRegistry.get(id);
              if (m) m.openPopup();
            }
            return;
          }
          const filterBtn = e.target.closest("#btn-filter-pending");
          if (filterBtn) {
            state.onlyPending = !state.onlyPending;
            renderMainContent();
            return;
          }
          if (e.target.closest("a[href]")) return;

          if (window.getSelection && String(window.getSelection()).trim().length > 0) return;

          const destEl = e.target.closest("[data-focus-pin], [data-pin-id]");
          if (destEl) {
            const pinId = destEl.getAttribute("data-focus-pin") || destEl.getAttribute("data-pin-id");
            highlightTimelineCard(pinId, false);
            focusPinOnMap(pinId);
          }
        });

        const fitBtn = document.getElementById("btn-map-fit");
        if (fitBtn) fitBtn.addEventListener("click", () => fitCurrentRoute());

        const expandBtn = document.getElementById("btn-map-expand");
        if (expandBtn) expandBtn.addEventListener("click", () => setMapExpanded(!state.mapExpanded));

        const closeBtn = document.getElementById("btn-map-close");
        if (closeBtn) closeBtn.addEventListener("click", () => setMapOpen(false));

        const drawer = document.getElementById("map-drawer");
        if (drawer) {
          drawer.addEventListener("transitionend", (e) => {
            if ((e.propertyName === "transform" || e.propertyName === "height") && map) {
              map.invalidateSize();
            }
          });
        }

        bindDrawerTouchGestures();

        document.addEventListener("keydown", (e) => {
          if (e.key === "Escape" && state.mapOpen) setMapOpen(false);
        });

        window.addEventListener("hashchange", () => {
          const next = getInitialTab();
          if (next !== state.activeTab) switchTab(next, false);
        });

        let resizeTimer = null;
        const onViewportChange = () => {
          clearTimeout(resizeTimer);
          resizeTimer = setTimeout(() => {
            if (map) map.invalidateSize();
          }, 120);
        };
        window.addEventListener("resize", onViewportChange, { passive: true });
        window.addEventListener("orientationchange", onViewportChange, { passive: true });

        const headerEl = document.querySelector(".app-header");
        if (headerEl && typeof window.ResizeObserver !== "undefined") {
          const ro = new window.ResizeObserver((entries) => {
            for (const entry of entries) {
              document.documentElement.style.setProperty("--header-h", Math.ceil(entry.target.getBoundingClientRect().height) + "px");
            }
          });
          ro.observe(headerEl);
        }
      }

      const GroupSync = (function () {
        const cfg = POA_TRIP_DATA.meta.groupSync;
        const validIds = new Set(getAllConfirmedStops().map((stop) => stop.id));
        let log = {};
        let deviceId;
        let pushTimer = null;
        let retryTimer = null;
        let eventSource = null;
        let inFlight = null;
        let rerun = false;
        let retryDelay = 2000;

        function validEntry(entry) {
          return entry && Number.isSafeInteger(entry.t) && entry.t >= 0 &&
            typeof entry.on === "boolean" &&
            (entry.d === undefined || (typeof entry.d === "string" && entry.d.length <= 100));
        }

        // Total ordering also resolves two devices changing a stop in the same millisecond.
        function compare(a, b) {
          if (!b) return 1;
          const left = String(a.d || "");
          const right = String(b.d || "");
          return a.t - b.t || (left > right ? 1 : left < right ? -1 : 0) ||
            Number(a.on) - Number(b.on);
        }

        function mergeEntries(incoming) {
          let changed = false;
          for (const id of validIds) {
            const entry = incoming && incoming[id];
            if (validEntry(entry) && compare(entry, log[id]) > 0) {
              log[id] = { t: entry.t, on: entry.on, d: entry.d || "" };
              changed = true;
            }
          }
          return changed;
        }

        mergeEntries(loadVisitedLog());

        function persist() {
          // Keep the in-memory log usable when browser storage is unavailable or full.
          try {
            window.localStorage.setItem(POA_TRIP_DATA.meta.logKey, JSON.stringify(log));
          } catch (_) {}
        }

        function getDeviceId() {
          if (deviceId) return deviceId;
          try { deviceId = window.localStorage.getItem(POA_TRIP_DATA.meta.deviceKey); } catch (_) {}
          if (!deviceId) {
            deviceId = window.crypto.randomUUID();
            try { window.localStorage.setItem(POA_TRIP_DATA.meta.deviceKey, deviceId); } catch (_) {}
          }
          return deviceId;
        }

        function setStatus(next) {
          const pill = document.getElementById("sync-pill");
          const label = document.getElementById("sync-label");
          if (!pill || !label) return;
          pill.classList.remove("is-ok", "is-pending", "is-off");
          pill.classList.add(next === "ok" ? "is-ok" : next === "pending" ? "is-pending" : "is-off");
          label.textContent = next === "ok" ? "Grupo atualizado" : next === "pending" ? "Sincronizando…" : "Modo local";
          pill.title = next === "ok" ? "Última sincronização concluída. Atualizações por notificação e consulta a cada 60 segundos." :
            next === "pending" ? "Enviando/atualizando estado do grupo…" :
            "Sincronização indisponível. As alterações serão reenviadas quando a conexão voltar.";
        }

        function refresh(silent) {
          state.visited = new Set(Object.keys(log).filter((id) => log[id].on));
          persist();
          saveVisited();
          updateProgressUI();
          renderMainContent();
          syncMapLayers(false);
          if (!silent) showToast("Atualizado por outro aparelho do grupo");
        }

        function recordLocal(id, on) {
          if (!validIds.has(id)) return;
          const latest = Math.max(0, ...Object.values(log).map((entry) => entry.t));
          log[id] = { t: Math.max(Date.now(), latest + 1), on: Boolean(on), d: getDeviceId() };
          persist();
          setStatus("pending");
          if (inFlight) rerun = true;
        }

        async function request(url, options = {}) {
          const controller = new AbortController();
          const timer = setTimeout(() => controller.abort(), 12000);
          try {
            const response = await fetch(url, { ...options, signal: controller.signal });
            if (!response.ok) throw new Error("sync HTTP " + response.status);
            // Read inside the timeout, including a server that stalls after headers.
            return await response.text();
          } finally {
            clearTimeout(timer);
          }
        }

        function needsPush(remote) {
          return Object.keys(log).some((id) => !validEntry(remote[id]) || compare(log[id], remote[id]) > 0);
        }

        function scheduleRetry() {
          clearTimeout(retryTimer);
          retryTimer = setTimeout(() => reconcile(true), retryDelay);
          retryDelay = Math.min(retryDelay * 2, 60000);
        }

        async function reconcile(silent = false) {
          if (!cfg) return;
          if (inFlight) {
            rerun = true;
            return inFlight;
          }
          inFlight = (async () => {
            try {
              do {
                rerun = false;
                const text = await request(cfg.snapshotUrl + "?t=" + Date.now(), { cache: "no-store" });
                const remote = JSON.parse(text);
                if (!remote || !remote.stops || typeof remote.stops !== "object" || Array.isArray(remote.stops)) {
                  throw new Error("Invalid group snapshot");
                }
                if (mergeEntries(remote.stops)) refresh(silent);
                if (needsPush(remote.stops)) {
                  setStatus("pending");
                  // Capture the payload now. Edits during the request trigger another pass.
                  const body = JSON.stringify({ v: 1, stops: log, by: getDeviceId() });
                  await request(cfg.snapshotUrl, { method: "POST", headers: { "Content-Type": "text/plain" }, body });
                  request(cfg.topic, { method: "POST", body: "roteiro-update" }).catch(() => {});
                  rerun = true; // Read back and repair an overlapping snapshot write.
                }
              } while (rerun);
              clearTimeout(retryTimer);
              retryDelay = 2000;
              setStatus("ok");
            } catch (_) {
              setStatus("off");
              scheduleRetry();
            } finally {
              inFlight = null;
            }
          })();
          return inFlight;
        }

        function queuePush() {
          if (!cfg) return;
          clearTimeout(pushTimer);
          pushTimer = setTimeout(() => reconcile(true), 700);
        }

        function subscribe() {
          if (!window.EventSource || eventSource) return;
          // EventSource reconnects automatically; polling/retries work independently.
          eventSource = new EventSource(cfg.topic + "/sse");
          eventSource.onmessage = () => reconcile(false);
          eventSource.onopen = () => reconcile(true);
        }

        function init() {
          if (!cfg) return;
          setStatus("pending");
          reconcile(false);
          subscribe();
          setInterval(() => {
            if (!document.hidden) reconcile(false);
          }, 60000);
          document.addEventListener("visibilitychange", () => {
            if (!document.hidden) reconcile(false);
          });
          window.addEventListener("online", () => reconcile(false));
          window.addEventListener("storage", (event) => {
            if (event.key === POA_TRIP_DATA.meta.logKey) {
              if (mergeEntries(loadVisitedLog())) refresh(true);
              queuePush();
            }
          });
        }

        return { init, queuePush, recordLocal };
      })();

      document.addEventListener("DOMContentLoaded", () => {
        updateProgressUI();
        renderDayTabs();
        scrollActiveTabIntoView();
        renderMainContent();
        initMap();
        syncMapLayers(true);
        bindEvents();
        GroupSync.init();
      });
    })();
  </script>
</body>
</html>
