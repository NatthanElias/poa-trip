<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Porto Alegre · Finados 2026 (31/10 a 02/11)</title>
  <meta name="description" content="Roteiro de 3 dias em Porto Alegre para 4 pessoas (31/10 a 02/11/2026). Horários, deslocamentos e mapa." />

  <meta property="og:type" content="website" />
  <meta property="og:locale" content="pt_BR" />
  <meta property="og:title" content="Porto Alegre · Roteiro Finados 2026" />
  <meta property="og:description" content="31/10 a 02/11 · 4 pessoas · Fast 10 City Hotel + 13 paradas e mapa." />
  <meta property="og:image" content="https://destinopoa.com.br/wp-content/uploads/2024/12/MG_6864_21_11zon.webp" />
  <meta name="theme-color" content="#F8F6F2" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet" />

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />

  <style>
    :root {
      --bg-page: #F8F6F2;
      --bg-surface: #FFFFFF;
      --bg-subtle: #F1EDE6;
      --ink-primary: #14181F;
      --ink-secondary: #465061;
      --ink-muted: #6C7585;
      --border: #E5E0D6;
      --border-strong: #CFC8BC;

      --day-overview: #1E293B;
      --day-sat: #D94E28;
      --day-sat-soft: #FFF3EE;
      --day-sun: #0F766E;
      --day-sun-soft: #ECFDF8;
      --day-mon: #4338CA;
      --day-mon-soft: #EEF2FF;
      --day-planb: #B45309;
      --day-planb-soft: #FFFBEB;

      --visited-green: #15803D;
      --visited-bg: #DCFCE7;

      --radius-xs: 8px;
      --radius-sm: 11px;
      --radius-md: 14px;
      --radius-pill: 999px;

      --shadow-xs: 0 1px 2px rgba(20, 24, 31, 0.04);
      --shadow-sm: 0 3px 10px rgba(20, 24, 31, 0.05);
      --shadow-md: 0 10px 24px rgba(20, 24, 31, 0.09);
      --shadow-float: 0 12px 28px rgba(15, 23, 42, 0.22);

      --font-display: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --font-sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;

      --header-h: 106px;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
      --gutter-x: 14px;

      --docked-map-h: min(52vh, 420px);
      --map-sheet-h: min(46vh, 410px);
    }

    @supports (height: 100dvh) {
      :root {
        --docked-map-h: min(52dvh, 420px);
        --map-sheet-h: min(46dvh, 410px);
      }
    }

    body.map-expanded {
      --docked-map-h: min(74vh, 580px);
      --map-sheet-h: min(76vh, 620px);
    }

    @supports (height: 100dvh) {
      body.map-expanded {
        --docked-map-h: min(74dvh, 580px);
        --map-sheet-h: min(76dvh, 620px);
      }
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
      -webkit-text-size-adjust: 100%;
      max-width: 100%;
      overflow-x: clip;
    }

    body {
      margin: 0;
      max-width: 100%;
      overflow-x: clip;
      background: var(--bg-page);
      color: var(--ink-primary);
      font-family: var(--font-sans);
      font-size: 14.5px;
      line-height: 1.48;
      -webkit-font-smoothing: antialiased;
    }

    img {
      max-width: 100%;
    }

    button, a {
      font-family: inherit;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    /* Sticky Header & Day Tabs */
    .app-header {
      position: sticky;
      top: 0;
      z-index: 900;
      padding-top: var(--safe-top);
      background: rgba(248, 246, 242, 0.95);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
    }

    .header-top {
      max-width: 780px;
      margin: 0 auto;
      padding: 9px max(var(--gutter-x), var(--safe-right)) 6px max(var(--gutter-x), var(--safe-left));
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 9px;
      min-width: 0;
      flex: 1 1 auto;
    }

    .brand-mark {
      width: 32px;
      height: 32px;
      border-radius: 9px;
      background: #1E293B;
      color: #FFFFFF;
      display: grid;
      place-items: center;
      font-family: var(--font-display);
      font-weight: 800;
      font-size: 11.5px;
      flex-shrink: 0;
    }

    .brand-text {
      min-width: 0;
      flex: 1 1 auto;
    }

    .brand-title {
      margin: 0;
      font-family: var(--font-display);
      font-size: 15px;
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .brand-meta {
      font-size: 11.5px;
      color: var(--ink-muted);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .progress-pill {
      display: flex;
      align-items: center;
      gap: 7px;
      min-height: 34px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-pill);
      padding: 4px 10px;
    }

    .progress-text {
      font-family: var(--font-display);
      font-size: 11.5px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .progress-bar-track {
      width: 48px;
      height: 5px;
      background: var(--bg-subtle);
      border-radius: var(--radius-pill);
      overflow: hidden;
      flex-shrink: 0;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: var(--visited-green);
      border-radius: var(--radius-pill);
      transition: width 0.25s ease;
    }

    .sync-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 34px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-pill);
      padding: 4px 10px;
      cursor: default;
    }

    .sync-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--ink-muted);
      flex-shrink: 0;
      transition: background 0.2s ease, box-shadow 0.2s ease;
    }

    .sync-pill.is-ok .sync-dot {
      background: #16A34A;
      box-shadow: 0 0 0 3px rgba(22, 163, 74, 0.14);
    }

    .sync-pill.is-pending .sync-dot {
      background: #D97706;
      box-shadow: 0 0 0 3px rgba(217, 119, 6, 0.14);
    }

    .sync-pill.is-off .sync-dot {
      background: var(--ink-muted);
      box-shadow: none;
    }

    .sync-label {
      font-family: var(--font-display);
      font-size: 11.5px;
      font-weight: 700;
      white-space: nowrap;
      color: var(--ink-secondary);
    }

    .btn-share-wa {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      min-height: 34px;
      padding: 5px 11px;
      border-radius: var(--radius-pill);
      border: 1px solid #BBF7D0;
      background: #F0FDF4;
      color: #166534;
      font-family: var(--font-display);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s ease, transform 0.1s ease;
    }

    .btn-share-wa:hover {
      background: #DCFCE7;
    }

    .btn-share-wa:active {
      transform: scale(0.97);
    }

    .day-switcher-wrap {
      max-width: 780px;
      margin: 0 auto;
      padding: 2px max(var(--gutter-x), var(--safe-right)) 9px max(var(--gutter-x), var(--safe-left));
    }

    .day-switcher {
      display: flex;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-x: contain;
      scroll-padding-inline: var(--gutter-x);
    }

    .day-switcher::-webkit-scrollbar {
      display: none;
    }

    .day-tab {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 36px;
      padding: 6px 13px;
      border-radius: var(--radius-pill);
      border: 1px solid var(--border);
      background: var(--bg-surface);
      color: var(--ink-secondary);
      font-family: var(--font-display);
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease, transform 0.1s ease;
    }

    .day-tab:hover {
      border-color: var(--border-strong);
      color: var(--ink-primary);
    }

    .day-tab:active {
      transform: scale(0.97);
    }

    .day-tab .tab-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .day-tab.is-active {
      background: var(--tab-color, var(--ink-primary));
      border-color: var(--tab-color, var(--ink-primary));
      color: #FFFFFF;
    }

    .day-tab.is-active .tab-dot {
      background: #FFFFFF !important;
    }

    /* Main Single-Column Workspace */
    .workspace {
      max-width: 780px;
      margin: 0 auto;
    }

    .timeline-pane {
      padding: 14px max(var(--gutter-x), var(--safe-right)) 18px max(var(--gutter-x), var(--safe-left));
      min-width: 0;
    }

    .hotel-showcase,
    .stop-card,
    .logistics-card {
      cursor: pointer;
      touch-action: manipulation;
      scroll-margin-top: calc(var(--header-h) + 10px);
    }

    /* Hybrid Map: Docked at Page Bottom + Floating Popup Sheet on Destination Click */
    .map-bottom-section {
      padding: 6px max(var(--gutter-x), var(--safe-right)) calc(38px + var(--safe-bottom)) max(var(--gutter-x), var(--safe-left));
      transition: padding-bottom 0.25s ease;
    }

    body.map-open .map-bottom-section {
      padding-bottom: calc(var(--map-sheet-h) + 28px + var(--safe-bottom));
    }

    .bottom-map-heading {
      margin-bottom: 9px;
    }

    .bottom-map-title {
      margin: 0 0 2px;
      font-family: var(--font-display);
      font-size: 16px;
      font-weight: 800;
      letter-spacing: -0.015em;
    }

    .bottom-map-sub {
      margin: 0;
      font-size: 12.5px;
      color: var(--ink-muted);
    }

    .map-slot {
      position: relative;
      min-height: var(--docked-map-h);
      border-radius: var(--radius-md);
    }

    body.map-open .map-slot {
      border: 1px dashed var(--border-strong);
      background: var(--bg-subtle);
      display: grid;
      place-items: center;
    }

    body.map-open .map-slot::before {
      content: "Mapa aberto na janela flutuante";
      font-family: var(--font-display);
      font-size: 12.5px;
      font-weight: 700;
      color: var(--ink-muted);
    }

    @keyframes mapPopupSlideUp {
      from {
        transform: translateY(100%);
      }
      to {
        transform: translateY(0);
      }
    }

    /* Default: Docked cleanly at the bottom of the page */
    .map-drawer {
      position: relative;
      width: 100%;
      height: var(--docked-map-h);
      min-height: 265px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: height 0.24s cubic-bezier(0.22, 1, 0.36, 1);
    }

    /* Popup Mode: Floats up over the bottom of the viewport when clicking a destination */
    body.map-open .map-drawer {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 880;
      max-width: 840px;
      margin: 0 auto;
      height: var(--map-sheet-h);
      min-height: 250px;
      padding-bottom: var(--safe-bottom);
      border: 1px solid var(--border-strong);
      border-bottom: none;
      border-radius: 18px 18px 0 0;
      box-shadow: 0 -12px 34px rgba(15, 23, 42, 0.22);
      animation: mapPopupSlideUp 0.26s cubic-bezier(0.22, 1, 0.36, 1);
      will-change: transform, height;
    }

    body.map-open .map-drawer.is-closing {
      animation: none;
      transform: translateY(105%);
      transition: transform 0.2s ease-in;
    }

    .map-drawer.is-dragging {
      animation: none !important;
      transition: none !important;
    }

    .map-drawer-header {
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body.map-open .map-drawer-header {
      touch-action: none;
    }

    .map-drag-handle {
      display: none;
      width: 38px;
      height: 4px;
      border-radius: var(--radius-pill);
      background: var(--border-strong);
      margin: 7px auto 2px;
    }

    body.map-open .map-drag-handle {
      display: block;
    }

    .map-drawer-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 12px;
    }

    body.map-open .map-drawer-bar {
      padding: 4px max(12px, var(--safe-right)) 8px max(12px, var(--safe-left));
    }

    .map-legend-pill {
      min-width: 0;
      flex: 1 1 auto;
      font-family: var(--font-display);
      font-size: 12.5px;
      font-weight: 800;
      color: var(--ink-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .map-drawer-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .btn-map-ctrl {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 34px;
      padding: 5px 11px;
      border: 1px solid var(--border-strong);
      background: var(--bg-subtle);
      color: var(--ink-primary);
      border-radius: var(--radius-pill);
      font-family: var(--font-display);
      font-size: 11.5px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s ease, transform 0.1s ease;
    }

    .btn-map-ctrl:hover {
      background: #E7E2D8;
    }

    .btn-map-ctrl:active {
      transform: scale(0.96);
    }

    .btn-map-ctrl[aria-pressed="true"] {
      background: #EEF2FF;
      border-color: #818CF8;
      color: #312E81;
    }

    .btn-map-close {
      display: none;
      align-items: center;
      justify-content: center;
      gap: 4px;
      min-height: 34px;
      padding: 5px 12px;
      border: none;
      background: #14181F;
      color: #FFFFFF;
      border-radius: var(--radius-pill);
      font-family: var(--font-display);
      font-size: 11.5px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s ease, transform 0.1s ease;
    }

    body.map-open .btn-map-close {
      display: inline-flex;
    }

    .btn-map-close:hover {
      background: #2C3444;
    }

    .btn-map-close:active {
      transform: scale(0.96);
    }

    .map-canvas {
      width: 100%;
      height: 100%;
      flex: 1 1 auto;
      min-height: 0;
      background: #E9E5DC;
    }

    /* Day Hero & Filter Bar */
    .day-hero {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-left: 4px solid var(--day-accent, var(--ink-primary));
      border-radius: var(--radius-sm);
      padding: 12px 14px;
      margin-bottom: 12px;
    }

    .day-hero-eyebrow {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 4px 8px;
      font-family: var(--font-display);
      font-size: 11.5px;
      font-weight: 700;
      color: var(--day-accent, var(--ink-primary));
      margin-bottom: 4px;
    }

    .day-hero-title {
      margin: 0 0 4px;
      font-family: var(--font-display);
      font-size: 17px;
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1.25;
    }

    .day-hero-desc {
      margin: 0;
      color: var(--ink-secondary);
      font-size: 13.5px;
      line-height: 1.45;
    }

    .filter-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
    }

    .filter-toggle {
      min-height: 34px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-pill);
      padding: 5px 12px;
      font-size: 12px;
      font-weight: 600;
      color: var(--ink-secondary);
      cursor: pointer;
    }

    .filter-toggle.is-active {
      background: #EEF2FF;
      border-color: #A5B4FC;
      color: #3730A3;
    }

    /* Overview Components */
    .hotel-showcase {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      overflow: hidden;
      margin-bottom: 14px;
      box-shadow: var(--shadow-xs);
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .hotel-showcase.is-highlighted {
      border-color: #0F172A;
      box-shadow: 0 0 0 2.5px rgba(15, 23, 42, 0.16), var(--shadow-md);
    }

    .hotel-media {
      position: relative;
      aspect-ratio: 16 / 9;
      max-height: 196px;
      min-height: 152px;
      width: 100%;
      background: #1E293B;
      cursor: pointer;
    }

    .hotel-media img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .hotel-badge-overlay {
      position: absolute;
      top: 10px;
      left: 10px;
      padding: 4px 10px;
      border-radius: var(--radius-pill);
      background: rgba(15, 23, 42, 0.86);
      color: #FDE68A;
      font-family: var(--font-display);
      font-size: 11px;
      font-weight: 700;
    }

    .hotel-body {
      padding: 13px 14px 14px;
    }

    .hotel-title-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 3px;
    }

    .hotel-title {
      margin: 0;
      font-family: var(--font-display);
      font-size: 16.5px;
      font-weight: 800;
      line-height: 1.25;
      min-width: 0;
    }

    .hotel-address {
      margin: 0 0 9px;
      font-size: 12.5px;
      color: var(--ink-muted);
      overflow-wrap: break-word;
    }

    .hotel-perks {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 10px;
    }

    .perk-chip {
      font-size: 11.5px;
      font-weight: 600;
      padding: 4px 9px;
      border-radius: 6px;
      background: var(--bg-subtle);
      max-width: 100%;
      line-height: 1.35;
    }

    .overview-days-grid {
      display: grid;
      gap: 10px;
      margin-bottom: 14px;
    }

    .overview-day-card {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 12px 13px;
      text-align: left;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 9px;
      transition: border-color 0.15s ease;
    }

    .overview-day-card:hover {
      border-color: var(--border-strong);
    }

    .ov-card-head-btn {
      appearance: none;
      border: none;
      background: transparent;
      padding: 0;
      margin: 0;
      width: 100%;
      text-align: left;
      cursor: pointer;
      color: inherit;
    }

    .ov-card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 5px;
    }

    .ov-day-pill {
      padding: 3px 9px;
      border-radius: var(--radius-pill);
      font-family: var(--font-display);
      font-size: 11.5px;
      font-weight: 800;
    }

    .ov-day-progress {
      font-family: var(--font-display);
      font-size: 11.5px;
      font-weight: 700;
      color: var(--ink-secondary);
      font-variant-numeric: tabular-nums;
    }

    .ov-card-title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .ov-card-title {
      margin: 0;
      font-family: var(--font-display);
      font-size: 14.5px;
      font-weight: 800;
      color: var(--ink-primary);
      line-height: 1.3;
    }

    .ov-open-hint {
      font-family: var(--font-display);
      font-size: 11px;
      font-weight: 700;
      color: var(--ink-muted);
      white-space: nowrap;
      flex-shrink: 0;
    }

    .ov-card-head-btn:hover .ov-open-hint {
      color: var(--ink-primary);
    }

    .ov-checklist {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      padding-top: 8px;
      border-top: 1px dashed var(--border);
    }

    .ov-check-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 31px;
      padding: 4px 9px 4px 7px;
      border-radius: 7px;
      border: 1px solid var(--border-strong);
      background: #FAF9F5;
      color: var(--ink-primary);
      font-family: var(--font-sans);
      font-size: 12px;
      font-weight: 600;
      line-height: 1.25;
      cursor: pointer;
      text-align: left;
      max-width: 100%;
      transition: background 0.15s ease, border-color 0.15s ease, transform 0.1s ease;
    }

    .ov-check-chip:hover {
      background: var(--bg-subtle);
      border-color: #94A3B8;
    }

    .ov-check-chip:active {
      transform: scale(0.97);
    }

    .ov-check-chip.is-checked {
      background: var(--visited-bg);
      border-color: #4ADE80;
      color: var(--visited-green);
    }

    .ov-check-chip.is-checked .ov-chip-name {
      text-decoration: line-through;
      text-decoration-thickness: 1.5px;
      opacity: 0.88;
    }

    .ov-chip-name {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .check-box-ui {
      width: 16px;
      height: 16px;
      border-radius: 4px;
      border: 1.75px solid #94A3B8;
      background: #FFFFFF;
      color: transparent;
      display: inline-grid;
      place-items: center;
      font-size: 11px;
      font-weight: 900;
      line-height: 1;
      flex-shrink: 0;
      transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
    }

    .is-checked .check-box-ui {
      background: #16A34A;
      border-color: #16A34A;
      color: #FFFFFF;
    }

    .logistics-summary-box {
      background: #FFFDF7;
      border: 1px solid #EFE0B0;
      border-radius: var(--radius-sm);
      padding: 13px 14px;
    }

    .logistics-summary-box h3 {
      margin: 0 0 6px;
      font-family: var(--font-display);
      font-size: 14px;
      font-weight: 800;
      color: #78350F;
    }

    .logistics-list {
      margin: 0;
      padding-left: 17px;
      color: #57411D;
      font-size: 13px;
      line-height: 1.48;
    }

    .logistics-list li + li {
      margin-top: 5px;
    }

    /* Timeline & Transit Pills */
    .timeline {
      position: relative;
      padding-left: 26px;
    }

    .timeline::before {
      content: "";
      position: absolute;
      top: 14px;
      bottom: 18px;
      left: 9px;
      width: 2px;
      background: var(--border-strong);
    }

    .transit-connector {
      position: relative;
      margin: 8px 0;
      display: flex;
      align-items: center;
      min-width: 0;
    }

    .transit-connector::before {
      content: "";
      position: absolute;
      left: -20px;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--bg-page);
      border: 2px solid var(--day-accent, #64748B);
    }

    .transit-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      max-width: 100%;
      padding: 4px 10px;
      border-radius: var(--radius-pill);
      background: var(--bg-subtle);
      border: 1px dashed var(--border-strong);
      color: var(--ink-secondary);
      font-family: var(--font-display);
      font-size: 11.5px;
      font-weight: 700;
      line-height: 1.3;
      font-variant-numeric: tabular-nums;
      overflow-wrap: break-word;
    }

    /* Compact Logistics Row */
    .logistics-card {
      position: relative;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 11px 13px;
      cursor: pointer;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .logistics-card.is-highlighted {
      border-color: var(--day-accent, var(--ink-primary));
      box-shadow: 0 0 0 2.5px rgba(30, 41, 59, 0.14), var(--shadow-sm);
    }

    .logistics-node {
      position: absolute;
      left: -23px;
      top: 14px;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--bg-surface);
      border: 2.5px solid var(--day-accent, #64748B);
    }

    .logistics-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      margin-bottom: 4px;
    }

    .logistics-head-badges {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      min-width: 0;
    }

    .time-badge {
      padding: 2.5px 8px;
      border-radius: 6px;
      background: var(--day-soft, var(--bg-subtle));
      color: var(--day-accent, var(--ink-primary));
      font-family: var(--font-display);
      font-size: 11.5px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .neighborhood-pill {
      padding: 2.5px 8px;
      border-radius: var(--radius-pill);
      background: var(--bg-subtle);
      color: var(--ink-secondary);
      font-size: 11.5px;
      font-weight: 600;
      max-width: 100%;
      overflow-wrap: break-word;
    }

    .logistics-title {
      margin: 0 0 3px;
      font-family: var(--font-display);
      font-size: 14.5px;
      font-weight: 800;
      line-height: 1.3;
    }

    .logistics-desc {
      margin: 0;
      font-size: 13px;
      color: var(--ink-secondary);
      line-height: 1.45;
      white-space: pre-line;
      overflow-wrap: break-word;
    }

    .logistics-links {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 9px;
    }

    /* Stop Card */
    .timeline-stop-wrap {
      position: relative;
      min-width: 0;
    }

    .timeline-stop-dot {
      position: absolute;
      left: -27px;
      top: 14px;
      width: 22px;
      height: 22px;
      padding: 0;
      border-radius: 50%;
      background: var(--day-accent, #1E293B);
      color: #FFFFFF;
      font-family: var(--font-display);
      font-size: 9.5px;
      font-weight: 800;
      display: grid;
      place-items: center;
      border: 2px solid var(--bg-page);
      cursor: pointer;
      z-index: 4;
      transition: transform 0.12s ease, background 0.15s ease;
    }

    .timeline-stop-dot:hover {
      transform: scale(1.1);
    }

    .timeline-stop-dot.is-visited {
      background: var(--visited-green);
    }

    .stop-card {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      overflow: hidden;
      box-shadow: var(--shadow-xs);
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .stop-card:hover {
      border-color: var(--border-strong);
      box-shadow: var(--shadow-sm);
    }

    .stop-card.is-highlighted {
      border-color: var(--day-accent, var(--ink-primary));
      box-shadow: 0 0 0 2.5px rgba(217, 78, 40, 0.18), var(--shadow-md);
    }

    .stop-card.is-visited {
      border-color: #86EFAC;
    }

    .stop-media {
      position: relative;
      aspect-ratio: 16 / 9;
      max-height: 192px;
      min-height: 148px;
      width: 100%;
      background: #1E293B;
      overflow: hidden;
      cursor: pointer;
    }

    .stop-media img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .media-top-badges {
      position: absolute;
      top: 9px;
      left: 9px;
      right: 9px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      z-index: 3;
      pointer-events: none;
    }

    .stop-number-pill {
      padding: 3.5px 9px;
      border-radius: var(--radius-pill);
      background: var(--day-accent, #1E293B);
      color: #FFFFFF;
      font-family: var(--font-display);
      font-size: 11px;
      font-weight: 800;
    }

    .category-glass-pill {
      padding: 3.5px 9px;
      border-radius: var(--radius-pill);
      background: rgba(15, 23, 42, 0.78);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      color: #FFFFFF;
      font-family: var(--font-display);
      font-size: 11px;
      font-weight: 700;
      max-width: 72%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .photo-next-btn {
      position: absolute;
      right: 9px;
      bottom: 9px;
      z-index: 4;
      min-height: 32px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      background: rgba(15, 23, 42, 0.76);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      color: #FFFFFF;
      border-radius: var(--radius-pill);
      padding: 5px 11px;
      font-family: var(--font-display);
      font-size: 11.5px;
      font-weight: 700;
      cursor: pointer;
    }

    .photo-next-btn:active {
      transform: scale(0.96);
    }

    /* Fallback Gradient Card (onerror) */
    .photo-fallback-poster {
      width: 100%;
      height: 100%;
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      color: #FFFFFF;
    }

    .fallback-kicker {
      font-family: var(--font-display);
      font-size: 10.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      opacity: 0.85;
      margin-bottom: 2px;
    }

    .fallback-title {
      font-family: var(--font-display);
      font-size: 17px;
      font-weight: 800;
      line-height: 1.2;
    }

    .grad-rose { background: linear-gradient(135deg, #9D174D, #E11D48); }
    .grad-terracotta { background: linear-gradient(135deg, #9A3412, #EA580C); }
    .grad-amber { background: linear-gradient(135deg, #78350F, #D97706); }
    .grad-spice { background: linear-gradient(135deg, #7C2D12, #CA8A04); }
    .grad-crimson { background: linear-gradient(135deg, #7F1D1D, #DC2626); }
    .grad-pink { background: linear-gradient(135deg, #831843, #DB2777); }
    .grad-teal { background: linear-gradient(135deg, #115E59, #0D9488); }
    .grad-emerald { background: linear-gradient(135deg, #065F46, #10B981); }
    .grad-forest { background: linear-gradient(135deg, #14532D, #15803D); }
    .grad-indigo { background: linear-gradient(135deg, #312E81, #4F46E5); }
    .grad-cobalt { background: linear-gradient(135deg, #1E3A8A, #2563EB); }
    .grad-violet { background: linear-gradient(135deg, #4C1D95, #7C3AED); }

    .stop-body {
      padding: 12px 14px 13px;
    }

    .stop-meta-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 6px;
    }

    .stop-meta-left {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      min-width: 0;
    }

    .btn-focus-map {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 29px;
      padding: 4px 10px;
      border: 1px solid var(--border-strong);
      background: var(--bg-subtle);
      color: var(--ink-primary);
      font-family: var(--font-display);
      font-size: 11.5px;
      font-weight: 700;
      cursor: pointer;
      border-radius: var(--radius-pill);
      flex-shrink: 0;
      white-space: nowrap;
      transition: background 0.15s ease, border-color 0.15s ease;
    }

    .btn-focus-map:hover {
      background: #E7E2D8;
    }

    .is-highlighted .btn-focus-map {
      background: var(--day-accent, #1E293B);
      border-color: var(--day-accent, #1E293B);
      color: #FFFFFF;
    }

    .stop-title {
      margin: 0 0 3px;
      font-family: var(--font-display);
      font-size: 16.5px;
      font-weight: 800;
      letter-spacing: -0.015em;
      line-height: 1.25;
      overflow-wrap: break-word;
    }

    .stop-address {
      margin: 0 0 8px;
      font-size: 12.5px;
      color: var(--ink-muted);
      overflow-wrap: break-word;
    }

    .stop-highlights {
      margin: 0 0 9px;
      font-size: 13.5px;
      line-height: 1.48;
      color: var(--ink-secondary);
      overflow-wrap: break-word;
    }

    .sublocations-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 9px;
    }

    .subloc-chip {
      display: inline-flex;
      align-items: center;
      min-height: 31px;
      font-size: 11.5px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: var(--radius-pill);
      background: var(--bg-subtle);
      color: var(--ink-primary);
      text-decoration: none;
      border: 1px solid var(--border);
    }

    a.subloc-chip:hover {
      border-color: var(--ink-primary);
      background: #FFFFFF;
    }

    .callout-why {
      background: #F8FAFC;
      border: 1px solid #E2E8F0;
      border-left: 3px solid var(--day-accent, #334155);
      border-radius: 7px;
      padding: 7px 10px;
      margin-bottom: 8px;
      font-size: 12.5px;
      line-height: 1.42;
      color: #334155;
      overflow-wrap: break-word;
    }

    .callout-group {
      background: #F0FDF4;
      border: 1px solid #BBF7D0;
      border-radius: 7px;
      padding: 7px 10px;
      margin-bottom: 8px;
      font-size: 12.5px;
      line-height: 1.42;
      color: #14532D;
      overflow-wrap: break-word;
    }

    .callout-holiday {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
      background: #FFFBEB;
      border: 1px solid #FCD34D;
      border-radius: 7px;
      padding: 7px 10px;
      margin-bottom: 9px;
      font-size: 12px;
      line-height: 1.4;
      font-weight: 600;
      color: #92400E;
    }

    .callout-holiday span {
      min-width: 0;
      flex: 1 1 190px;
    }

    .callout-holiday a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 32px;
      padding: 5px 12px;
      border-radius: var(--radius-pill);
      background: #D97706;
      color: #FFFFFF;
      font-family: var(--font-display);
      font-size: 11.5px;
      font-weight: 700;
      text-decoration: none;
      white-space: nowrap;
    }

    .action-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
    }

    .action-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      min-height: 36px;
      padding: 7px 11px;
      border-radius: var(--radius-xs);
      border: 1px solid var(--border);
      background: var(--bg-surface);
      color: var(--ink-primary);
      font-family: var(--font-display);
      font-size: 12px;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s ease, border-color 0.15s ease, transform 0.1s ease;
    }

    .action-btn:hover {
      background: var(--bg-subtle);
      border-color: var(--border-strong);
    }

    .action-btn:active {
      transform: scale(0.98);
    }

    .action-btn-maps {
      background: #F8FAFC;
      border-color: #CBD5E1;
    }

    .action-btn-visited {
      margin-left: auto;
      gap: 7px;
      padding: 7px 12px 7px 9px;
      background: #FAF9F5;
      border-color: #CBD5E1;
      color: var(--ink-primary);
    }

    .action-btn-visited:hover {
      background: #F1F5F9;
      border-color: #94A3B8;
    }

    .action-btn-visited.is-checked {
      background: var(--visited-bg);
      border-color: #4ADE80;
      color: var(--visited-green);
    }

    @media (max-width: 480px) {
      .action-btn-visited {
        flex: 1 1 100%;
        order: -1;
        margin-left: 0;
        justify-content: center;
      }
    }

    .planb-grid {
      display: grid;
      gap: 12px;
    }

    @media (min-width: 680px) {
      body {
        font-size: 14px;
      }
      .overview-days-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
      .planb-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    /* Leaflet Custom Pins, Controls & Popups */
    .poa-pin-wrapper {
      background: transparent;
      border: none;
    }

    .poa-pin {
      width: 32px;
      height: 32px;
      border-radius: 50% 50% 50% 4px;
      transform: rotate(-45deg);
      background: var(--pin-bg, #1E293B);
      border: 2px solid #FFFFFF;
      box-shadow: 0 3px 10px rgba(15, 23, 42, 0.32);
      display: grid;
      place-items: center;
      position: relative;
    }

    .poa-pin span {
      transform: rotate(45deg);
      color: #FFFFFF;
      font-family: var(--font-display);
      font-size: 11px;
      font-weight: 800;
      line-height: 1;
    }

    .poa-pin.is-hotel {
      width: 35px;
      height: 35px;
      background: #0F172A;
      border-color: #FBBF24;
    }

    .poa-pin.is-visited::after {
      content: "✓";
      transform: rotate(45deg);
      position: absolute;
      top: -6px;
      right: -6px;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #16A34A;
      color: #FFFFFF;
      font-size: 8.5px;
      font-weight: 900;
      display: grid;
      place-items: center;
      border: 1.5px solid #FFFFFF;
    }

    .leaflet-control-zoom {
      border: 1px solid var(--border-strong) !important;
      border-radius: 10px !important;
      overflow: hidden;
      box-shadow: var(--shadow-sm) !important;
      margin-right: 10px !important;
      margin-bottom: 10px !important;
    }

    .leaflet-control-zoom a {
      width: 36px !important;
      height: 36px !important;
      line-height: 36px !important;
      font-size: 18px !important;
      color: var(--ink-primary) !important;
      background: rgba(255, 255, 255, 0.96) !important;
    }

    .leaflet-control-layers {
      border: 1px solid var(--border-strong) !important;
      border-radius: 10px !important;
      box-shadow: var(--shadow-sm) !important;
      background: rgba(255, 255, 255, 0.96) !important;
      font-family: var(--font-sans) !important;
      font-size: 12px !important;
      margin-top: 10px !important;
      margin-right: 10px !important;
    }

    .leaflet-control-layers-toggle {
      width: 34px !important;
      height: 34px !important;
      background-size: 18px 18px !important;
    }

    .leaflet-control-attribution {
      font-size: 9.5px !important;
      padding: 1px 6px !important;
      background: rgba(255, 255, 255, 0.78) !important;
      max-width: 72vw;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .leaflet-popup-content-wrapper {
      border-radius: 12px !important;
      padding: 0 !important;
      overflow: hidden;
      box-shadow: var(--shadow-md) !important;
    }

    .leaflet-popup-content {
      margin: 0 !important;
      width: min(220px, calc(100vw - 56px)) !important;
      font-family: var(--font-sans);
    }

    .leaflet-container a.leaflet-popup-close-button {
      width: 28px !important;
      height: 28px !important;
      font-size: 18px !important;
      line-height: 26px !important;
      color: var(--ink-muted) !important;
      top: 4px !important;
      right: 4px !important;
    }

    .map-popup-card {
      padding: 11px 12px;
    }

    .map-popup-kicker {
      font-family: var(--font-display);
      font-size: 10.5px;
      font-weight: 800;
      margin-bottom: 2px;
      padding-right: 18px;
    }

    .map-popup-title {
      margin: 0 0 3px;
      font-family: var(--font-display);
      font-size: 13.5px;
      font-weight: 800;
      line-height: 1.25;
      color: var(--ink-primary);
      padding-right: 14px;
    }

    .map-popup-addr {
      margin: 0 0 9px;
      font-size: 11.5px;
      line-height: 1.35;
      color: var(--ink-muted);
    }

    .map-popup-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }

    .popup-btn-visited {
      flex: 1 1 100% !important;
      gap: 6px;
      border: 1px solid #CBD5E1;
      background: #FAF9F5;
      color: var(--ink-primary);
    }

    .popup-btn-visited.is-checked {
      background: var(--visited-bg);
      border-color: #4ADE80;
      color: var(--visited-green);
    }

    .map-popup-actions a,
    .map-popup-actions button {
      flex: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 34px;
      text-align: center;
      padding: 6px 8px;
      border-radius: 7px;
      font-family: var(--font-display);
      font-size: 11.5px;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
    }

    .popup-btn-card {
      border: 1px solid var(--border-strong);
      background: var(--bg-subtle);
      color: var(--ink-primary);
    }

    .popup-btn-gmaps {
      border: none;
      background: #1E293B;
      color: #FFFFFF !important;
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: calc(18px + var(--safe-bottom));
      transition: bottom 0.25s ease, opacity 0.2s ease, transform 0.2s ease;
      left: 50%;
      transform: translateX(-50%) translateY(12px);
      max-width: calc(100vw - 28px);
      background: #14181F;
      color: #FFFFFF;
      padding: 8px 14px;
      border-radius: var(--radius-pill);
      font-family: var(--font-display);
      font-size: 12px;
      font-weight: 700;
      box-shadow: var(--shadow-float);
      opacity: 0;
      pointer-events: none;
      z-index: 1000;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    body.map-open .toast {
      bottom: calc(var(--map-sheet-h) + 12px + var(--safe-bottom));
    }

    .toast.is-visible {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    @media (max-width: 640px) {

          --map-sheet-h: 46dvh;

          --map-sheet-h: 78dvh;
        }
      }

      .day-switcher-wrap {
        padding-left: 0;
        padding-right: 0;
      }

      .day-switcher {
        padding-left: max(var(--gutter-x), var(--safe-left));
        padding-right: max(var(--gutter-x), var(--safe-right));
      }

      body.map-open .map-drawer {
        max-width: 100%;
        border-left: none;
        border-right: none;
        border-radius: 18px 18px 0 0;
        min-height: 245px;
      }

      .fit-label-long {
        display: none;
      }

      .action-bar .action-btn {
        min-height: 38px;

      }

      .action-bar .action-btn-visited {
        margin-left: 0;
        flex: 1 1 100%;
        min-height: 40px;
      }

      .logistics-links .action-btn {
        min-height: 36px;
        flex: 1 1 auto;
      }
    }

    @media (max-width: 480px) {
      .progress-suffix {
        display: none;
      }

      .sync-label {
        display: none;
      }

      .progress-bar-track {
        width: 34px;
      }

      .brand-title {
        font-size: 14.5px;
      }

      .brand-meta {
        font-size: 11px;
      }

      .stop-body,

      function loadVisitedLog() {
        try {
          const raw = window.localStorage.getItem(POA_TRIP_DATA.meta.logKey);
          const parsed = raw ? JSON.parse(raw) : null;
          return parsed && typeof parsed === "object" ? parsed : null;
        } catch (_) {
          return null;

      function loadVisited() {
        const log = loadVisitedLog();
        if (log) {
          const derived = new Set();
          Object.keys(log).forEach((id) => {
            if (log[id] && log[id].on) derived.add(id);
          });
          return derived;
        }
        try {
          const raw = window.localStorage.getItem(POA_TRIP_DATA.meta.storageKey);
          const parsed = raw ? JSON.parse(raw) : [];
          const legacy = new Set(Array.isArray(parsed) ? parsed : []);
          const migrated = {};
          legacy.forEach((id) => {
            migrated[id] = { t: 0, on: true };
          });
          try {
            window.localStorage.setItem(POA_TRIP_DATA.meta.logKey, JSON.stringify(migrated));
          } catch (_) {}
          return legacy;
        } catch (_) {
          return new Set();
        }
      }

          if (nextIdx < fallbacks.length) {

        } catch (_) {}

        const theme = imgEl.getAttribute("data-grad") || "cobalt";

      function escapeHtml(str) {
        return String(str == null ? "" : str)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      function showToast(msg) {
        const el = document.getElementById("app-toast");
        if (!el) return;
        el.textContent = msg;
        el.classList.add("is-visible");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => el.classList.remove("is-visible"), 2200);
      }

      function updateProgressUI() {
        const total = POA_TRIP_DATA.meta.totalConfirmedStops;
        const allIds = new Set(getAllConfirmedStops().map((s) => s.id));
        let count = 0;
        state.visited.forEach((id) => {
          if (allIds.has(id)) count += 1;
        });
        const pct = Math.round((count / total) * 100);
        const labelEl = document.getElementById("progress-label");
        const fillEl = document.getElementById("progress-fill");
        if (labelEl) {
          labelEl.innerHTML =
            '<span class="progress-count">' + count + "/" + total + '</span><span class="progress-suffix"> visitados</span>';
        }
        if (fillEl) fillEl.style.width = pct + "%";
      }

      function scrollActiveTabIntoView() {
        const container = document.getElementById("day-switcher");
        if (!container) return;
        const activeBtn = container.querySelector(".day-tab.is-active");
        if (activeBtn && typeof activeBtn.scrollIntoView === "function") {
          activeBtn.scrollIntoView({ behavior: "smooth", inline: "center", block: "nearest" });
        }
      }

      function renderDayTabs() {
        const container = document.getElementById("day-switcher");
        if (!container) return;
        const tabs = [
          POA_TRIP_DATA.dayThemes.overview,
          POA_TRIP_DATA.dayThemes.sat,
          POA_TRIP_DATA.dayThemes.sun,
          POA_TRIP_DATA.dayThemes.mon,
          POA_TRIP_DATA.dayThemes.planb
        ];
        container.innerHTML = tabs
          .map((t) => {
            const active = state.activeTab === t.id;
            return (
              '<button type="button" class="day-tab' + (active ? " is-active" : "") +
              '" style="--tab-color:' + t.color + '" data-tab="' + t.id + '">' +
              '<span class="tab-dot" style="background:' + t.color + '"></span>' +
              "<span>" + escapeHtml(t.shortLabel) + "</span></button>"
            );
          })
          .join("");
      }

      function buildImgTag(images, opts) {
        const list = Array.isArray(images) && images.length ? images : [""];
        const idx = opts.photoIdx || 0;
        const primary = list[idx % list.length];
        const remaining = list.filter((_, i) => i !== idx % list.length);
        return (
          '<img src="' + escapeHtml(primary) +
          '" alt="' + escapeHtml(opts.title) +
          '" loading="lazy" referrerpolicy="no-referrer" data-fallbacks="' +
          escapeHtml(JSON.stringify(remaining)) +
          '" data-fb-idx="0" data-grad="' + escapeHtml(opts.grad || "cobalt") +
          '" data-cat="' + escapeHtml(opts.category || "") +
          '" data-hood="' + escapeHtml(opts.neighborhood || "") +
          '" data-title="' + escapeHtml(opts.title || "") +
          '" onerror="window.handleImgError(this)" />'
        );
      }

                .map((ql) =>

                .join("")

          '<article class="logistics-card' + (isHighlighted ? " is-highlighted" : "") + '" id="card-' + item.id + '" data-focus-pin="' + item.id +

          '<button type="button" class="btn-focus-map" data-focus-pin="' + item.id + '">Mapa</button></div>' +
          '<h3 class="logistics-title">' + escapeHtml(item.title) + "</h3>" +
          '<p class="logistics-desc">' + escapeHtml(item.description) + "</p>" +
          (hasLinks
            ? '<div class="logistics-links">' +
              (item.mapsUrl
                ? '<a class="action-btn action-btn-maps" href="' + escapeHtml(item.mapsUrl) + '" target="_blank" rel="noopener noreferrer">Maps</a>'
                : "") +

                : "") +
              quickLinksHtml +
              "</div>"
            : "") +
          "</article>"
        );

      function renderDayTimeline(dayKey) {
        const theme = POA_TRIP_DATA.dayThemes[dayKey];
        const items = POA_TRIP_DATA.days[dayKey] || [];
        const dayStops = getDayStops(dayKey);
        const visitedCount = dayStops.filter((s) => state.visited.has(s.id)).length;

        const timelineHtml = items
          .filter((item) => (!state.onlyPending || item.type !== "stop" ? true : !state.visited.has(item.id)))
          .map((item) => {
            if (item.type === "transit") {
              return (
                '<div class="transit-connector" style="--day-accent:' + theme.color + '">' +
                '<span class="transit-pill">' + escapeHtml(item.label) + "</span></div>"
              );
            }
            if (item.type === "logistics") return renderLogisticsCard(item, theme);
            return renderStopCard(item, theme);
          })
          .join("");

        return (
          '<section class="day-hero" style="--day-accent:' + theme.color + '">' +
          '<div class="day-hero-eyebrow"><span>' + escapeHtml(theme.fullTitle) + "</span>" +
          "<span>" + visitedCount + "/" + dayStops.length + " visitados</span></div>" +
          '<h2 class="day-hero-title">' + escapeHtml(theme.themeTitle) + "</h2>" +
          '<p class="day-hero-desc">' + escapeHtml(theme.themeSubtitle) + "</p></section>" +
          '<div class="filter-bar">' +
          '<span class="neighborhood-pill">' + escapeHtml(theme.stats) + "</span>" +
          '<button type="button" class="filter-toggle' + (state.onlyPending ? " is-active" : "") + '" id="btn-filter-pending">' +
          (state.onlyPending ? "Mostrando pendentes" : "Filtrar pendentes") + "</button></div>" +
          '<div class="timeline" style="--day-accent:' + theme.color + '">' + timelineHtml + "</div>"
        );
      }

              '<h3 class="stop-title">' + escapeHtml(spot.name) + "</h3>" +

      function renderMainContent() {
        const pane = document.getElementById("timeline-content");
        if (!pane) return;

        else if (state.activeTab === "planb") pane.innerHTML = renderPlanB();

      /* Map Synchronization & Hybrid Docked + Popup Behavior */
      function initMap() {
        const mapEl = document.getElementById("poa-map");
        if (!mapEl || typeof window.L === "undefined") return;

        map = window.L.map(mapEl, {
          zoomControl: false,
          scrollWheelZoom: true,
          tapTolerance: 18
        }).setView([-30.0265, -51.2015], 13);

        window.L.control.zoom({ position: "bottomright" }).addTo(map);
        const esriClean = window.L.tileLayer(
          "https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}",
          {
            attribution: "Tiles &copy; Esri &middot; Dados OSM",
            maxNativeZoom: 19,
            maxZoom: 20
          }
        );
        const osmDetailed = window.L.tileLayer(
          "https://{s}.tile.openstreetmap.fr/hot/{z}/{x}/{y}.png",
          {
            attribution: "&copy; <a href=\"https://www.openstreetmap.org/copyright\">OpenStreetMap</a> &middot; HOT",
            subdomains: "abc",
            maxNativeZoom: 19,
            maxZoom: 20
          }
        );
        const esriSat = window.L.tileLayer(
          "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
          {
            attribution: "Tiles &copy; Esri",
            maxNativeZoom: 19,
            maxZoom: 20
          }
        );

        esriClean.addTo(map);
        window.L.control.layers(
          {
            "Mapa limpo": esriClean,
            "Ruas detalhadas (OSM)": osmDetailed,
            "Satélite": esriSat
          },
          null,
          { position: "topright", collapsed: true }
        ).addTo(map);

        routesLayer = window.L.layerGroup().addTo(map);
        markersLayer = window.L.layerGroup().addTo(map);
      }

        const isHotel = extraClass && extraClass.includes("is-hotel");

          className: "poa-pin-wrapper",

          iconSize: isHotel ? [35, 35] : [32, 32],
          iconAnchor: isHotel ? [17, 33] : [16, 30],
          popupAnchor: [0, -28]
        });
      }

          '<p class="map-popup-addr">' + escapeHtml(opts.address) + "</p>" +
